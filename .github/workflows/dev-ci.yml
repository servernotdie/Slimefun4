name: Slimefun Dev CI

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ vars.JAVA_CI_VERSION || 21 }}
          java-package: jdk
          architecture: x64
          cache: gradle

      - name: Configure git
        run: |
          git config user.name "noraincity-bot"
          git config user.email "${{ secrets.BOT_EMAIL }}"

      - name: Apply patches
        run: bash patches/patch.sh --skip-build

      - name: Environment Setup
        id: env-setup
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          TAG="Build-$SHORT_COMMIT_HASH"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "JAR_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build Slimefun
        run: ./gradlew clean build -PprojectVersion="$JAR_VERSION" --no-daemon

      - name: Get build artifact filename
        run: |
          FILENAME=$(find build/libs -maxdepth 1 -type f -name "Slimefun-*.jar" ! -name "*-sources.jar" -printf "%f\n")
          [ -n "$FILENAME" ]
          [ "$(printf "%s\n" "$FILENAME" | wc -l)" -eq 1 ]
          echo "SLIMEFUN_ARTIFACT_NAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SLIMEFUN_ARTIFACT_NAME }}
          path: build/libs/${{ env.SLIMEFUN_ARTIFACT_NAME }}

      - name: Create Release
        run: |
          gh release create "$TAG" \
            --title "Slimefun $TAG" \
            --notes "Auto build from commit ${{ github.sha }}" \
            --prerelease \
            "build/libs/$SLIMEFUN_ARTIFACT_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
